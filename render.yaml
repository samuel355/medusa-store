services:
  - type: web
    name: begnon-medusa-backend
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: apps/backend
    buildCommand: npm install && npm run build && cd .medusa/server && npm install --omit=dev
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: medusastore

      - key: MEDUSA_REDIS_ENABLED
        value: "true"
      - key: REDIS_URL
        sync: false

      # Generate real random values, don't reuse dev secrets.
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true

      # STORE_CORS needs the Vercel storefront URL; ADMIN_CORS/AUTH_CORS need
      # this service's own Render URL.
      - key: STORE_CORS
        sync: false
      - key: ADMIN_CORS
        sync: false
      - key: AUTH_CORS
        sync: false

      # Storefront URL for the admin's "Open shop" links (storefront-url.ts).
      - key: PLUGIN_STOREFRONT_URL
        sync: false

      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false

      - key: ARKESEL_API_KEY
        sync: false

      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
