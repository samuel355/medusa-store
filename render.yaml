services:
  - type: web
    name: begnon-medusa-backend
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: apps/backend
    buildCommand: bash scripts/ci-build.sh
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      # Medusa's config loader does require("medusa-config") with no
      # extension, relying on Node's native .ts resolution (stable by
      # default from Node 23.6+) — Node 20 can't find the file at all.
      - key: NODE_VERSION
        value: 24.16.0
      - key: NODE_ENV
        value: production
      # Starter's 512MB container is tight for Medusa (framework + ~15
      # modules + the bundled admin dashboard in one process). V8 in
      # containers can under-detect available memory and GC too late,
      # crashing with "Ineffective mark-compacts" instead of collecting
      # proactively. Capping the heap below the container limit forces
      # earlier, more frequent GC instead of running up against the wall.
      - key: NODE_OPTIONS
        value: --max-old-space-size=400
      # Retry transient npm registry errors (e.g. 429s) instead of failing the build.
      - key: npm_config_fetch_retries
        value: "5"
      - key: npm_config_fetch_retry_mintimeout
        value: "20000"
      - key: npm_config_fetch_retry_maxtimeout
        value: "120000"

      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: medusastore

      - key: MEDUSA_REDIS_ENABLED
        value: "true"
      - key: REDIS_URL
        sync: false

      # Generate real random values, don't reuse dev secrets.
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true

      # STORE_CORS needs the Vercel storefront URL; ADMIN_CORS/AUTH_CORS need
      # this service's own Render URL.
      - key: STORE_CORS
        sync: false
      - key: ADMIN_CORS
        sync: false
      - key: AUTH_CORS
        sync: false

      # Storefront URL for the admin's "Open shop" links (storefront-url.ts).
      - key: PLUGIN_STOREFRONT_URL
        sync: false

      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false

      - key: ARKESEL_API_KEY
        sync: false
      - key: ARKESEL_SENDER_ID
        sync: false

      - key: RESEND_API_KEY
        sync: false
      # onboarding@resend.dev needs no domain verification. Switch to a
      # verified custom-domain address once one exists.
      - key: RESEND_FROM_EMAIL
        value: "Begnon <onboarding@resend.dev>"

      - key: PLATFORM_ADMIN_PHONE
        sync: false
      - key: PLATFORM_ADMIN_EMAIL
        sync: false

      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
